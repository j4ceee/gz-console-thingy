name: released

permissions:
  contents: read

on:
  release:
    types:
      - published

jobs:
  virustotal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: robinraju/release-downloader@v1
        with:
          latest: true
          fileName: "*.zip"
          
      - name: Extract DLL from ZIP
        run: |
          unzip *.zip "*.dll" -d extracted/
          
      - name: VirusTotal Scan - ZIP
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            .zip$
            
      - name: VirusTotal Scan - DLL
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            extracted/.*.dll$
